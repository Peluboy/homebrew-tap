name: GitHub Release

on:
  workflow_dispatch:
  push:
    paths:
      - FileDocket.dmg
      - Casks/filedocket.rb
      - .github/workflows/github-release.yml

concurrency:
  group: tap-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish tagged DMG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ver=$(ruby -e 'puts File.read("Casks/filedocket.rb")[/version "([^"]+)"/, 1]')
          test -n "$ver"
          test -f FileDocket.dmg
          gh release view "v$ver" >/dev/null 2>&1 || \
            gh release create "v$ver" --title "FileDocket $ver" --notes "Universal Intel and Apple Silicon DMG."
          gh release delete-asset "v$ver" FileDocket.dmg --yes 2>/dev/null || true
          gh release upload "v$ver" FileDocket.dmg
